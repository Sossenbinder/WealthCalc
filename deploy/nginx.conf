server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Traefik terminates TLS and forwards plain HTTP, so nginx's own view of
    # scheme, host and port is wrong. Relative redirects let the browser keep
    # the address it actually used — otherwise /kreditrechner would bounce a
    # visitor to http://localhost/kreditrechner/.
    absolute_redirect off;
    port_in_redirect off;

    # The export uses trailingSlash: true, so /kreditrechner/ is a directory
    # holding index.html. Without the directory fallback every calculator 404s.
    # Ending in =404 rather than /404.html matters: the fallback must carry a
    # 404 status, or crawlers index every mistyped address as a real page.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashed assets are immutable; the HTML must not be, or a deploy would be
    # invisible to anyone who had already visited.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
